<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101827" />
    <title>ออฟไลน์ · ARCANA</title>
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; height: 100%; }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        box-sizing: border-box;
        background: radial-gradient(ellipse 80% 50% at 50% -10%, #1f3453, #101827 70%);
        color: #f0e9da;
        font-family: "Noto Sans Thai", system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        line-height: 1.7;
      }
      img { width: 96px; height: 96px; border-radius: 22px; }
      h1 { margin: 0; font-size: 22px; font-weight: 600; }
      p { margin: 0; max-width: 300px; color: rgba(240, 233, 218, 0.72); font-size: 15px; }
      button {
        margin-top: 8px;
        min-height: 48px;
        padding: 0 28px;
        border: 0;
        border-radius: 999px;
        background: #c6a15b;
        color: #101827;
        font: inherit;
        font-weight: 600;
        font-size: 16px;
      }
      button:focus-visible { outline: 2px solid #f0e9da; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <img src="/icons/icon-192.png" alt="" />
    <h1>ยังไม่ได้เชื่อมต่ออินเทอร์เน็ต</h1>
    <p>ARCANA ต้องใช้อินเทอร์เน็ตเพื่อเปิดไพ่และอ่านไพ่ ประวัติและไพ่ของคุณยังอยู่ครบ เชื่อมต่อแล้วลองอีกครั้ง</p>
    <button type="button" onclick="location.reload()">ลองอีกครั้ง</button>
  </body>
</html>
